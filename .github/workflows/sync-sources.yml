name: Sync LOLDrivers and LOLRMM sources

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Mirror and normalize upstream data
        run: python scripts/sync_sources.py --output-dir data
      - name: Refresh identity proposals without changing approved profiles
        run: python scripts/rmm_identity.py --check --refresh-proposals
      - name: Refresh candidate discovery indicators without granting signer trust
        run: python scripts/rmm_discovery.py --refresh
      - name: Validate source and query contracts
        run: |
          python scripts/rmm_reference_data.py --check
          python scripts/rmm_discovery.py --check
          python scripts/build_rmm_queries.py --check
          python -m unittest discover -s scripts/tests -v
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.csv data/manifest.json data/rmm_profile_candidates*.json data/rmm_discovery_source.json
          if git diff --cached --quiet; then
            echo 'No upstream changes.'
          else
            git commit -m 'chore(data): sync LOLDrivers and LOLRMM sources'
            git push
          fi
