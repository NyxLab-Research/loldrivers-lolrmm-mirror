name: Validate generated RMM queries

on:
  pull_request:
    paths:
      - 'rules/**'
      - 'queries/**'
      - 'scripts/build_rmm_queries.py'
      - 'scripts/rmm_report_rules.py'
      - 'scripts/rmm_identity.py'
      - 'scripts/build_rmm_identity_queries.py'
      - 'scripts/sync_sources.py'
      - 'scripts/sync_rmm_profiles.py'
      - 'scripts/cortex_lookup.py'
      - 'scripts/check_cortex_query_budget.py'
      - 'data/rmm_tool_profiles.csv'
      - 'scripts/tests/**'
      - 'scripts/rmm_native_queries.py'
      - 'scripts/rmm_domain*.py'
      - 'scripts/rmm_discovery.py'
      - 'data/rmm_discovery*'
      - 'scripts/rmm_reference_data.py'
      - 'scripts/tenant_credentials.py'
      - 'scripts/sync_rmm_references.py'
      - 'data/rmm_tool_profiles_v2.csv'
      - 'data/rmm_general_rules.csv'
      - 'requirements-rmm.txt'
      - 'scripts/run_cortex_sync.py'
      - '.github/workflows/validate-rmm-queries.yml'
  push:
    paths:
      - 'rules/**'
      - 'queries/**'
      - 'scripts/build_rmm_queries.py'
      - 'scripts/rmm_report_rules.py'
      - 'scripts/rmm_identity.py'
      - 'scripts/build_rmm_identity_queries.py'
      - 'scripts/sync_sources.py'
      - 'scripts/sync_rmm_profiles.py'
      - 'scripts/cortex_lookup.py'
      - 'scripts/check_cortex_query_budget.py'
      - 'data/rmm_tool_profiles.csv'
      - 'scripts/tests/**'
      - 'scripts/rmm_native_queries.py'
      - 'scripts/rmm_domain*.py'
      - 'scripts/rmm_discovery.py'
      - 'data/rmm_discovery*'
      - 'scripts/rmm_reference_data.py'
      - 'scripts/tenant_credentials.py'
      - 'scripts/sync_rmm_references.py'
      - 'data/rmm_tool_profiles_v2.csv'
      - 'data/rmm_general_rules.csv'
      - 'requirements-rmm.txt'
      - 'scripts/run_cortex_sync.py'
      - '.github/workflows/validate-rmm-queries.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate rules and check generated queries
        run: |
          python -m pip install -r requirements-rmm.txt
          python scripts/rmm_identity.py --check
          python scripts/rmm_reference_data.py --check
          python scripts/rmm_discovery.py --check
          python scripts/build_rmm_queries.py --check
      - name: Check report scope and certificate evidence boundaries
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
