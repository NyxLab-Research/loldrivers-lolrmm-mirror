name: Validate generated RMM queries

on:
  pull_request:
    paths:
      - 'rules/**'
      - 'queries/**'
      - 'scripts/build_rmm_queries.py'
      - 'scripts/rmm_report_rules.py'
      - '.github/workflows/validate-rmm-queries.yml'
  push:
    paths:
      - 'rules/**'
      - 'queries/**'
      - 'scripts/build_rmm_queries.py'
      - 'scripts/rmm_report_rules.py'
      - '.github/workflows/validate-rmm-queries.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate rules and check generated queries
        run: python scripts/build_rmm_queries.py --check
